name: Pulse
options:
  bundleIdPrefix: dev.zibochen
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: Pulse
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zibochen.Pulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PulseTests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zibochen.PulseTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pulse.app/Contents/MacOS/Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"
